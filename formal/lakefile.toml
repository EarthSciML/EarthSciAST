name = "esm"
defaultTargets = ["Esm", "esm-lean"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Esm"

[[lean_lib]]
name = "Adapter"

[[lean_exe]]
name = "esm-lean"
root = "Adapter.Main"
supportInterpreter = false
