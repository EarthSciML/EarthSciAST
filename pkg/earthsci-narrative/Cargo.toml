[package]
name = "earthsci-narrative"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["EarthSciML Authors and Contributors"]
description = "Assemble EarthSciAST models from narrative documents (Markdown, Typst), run their tests and analyses, and draw their figures"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciAST"
publish = false

# The shared core behind the Markdown and Typst front ends. It must build for
# `wasm32-unknown-unknown` with no host imports, because the Typst plugin and
# the browser widget both link it: keep every dependency pure Rust, and keep
# filesystem, clock and thread APIs out of the library.
#
# The Markdown front end and its command are the exception, and that is what
# the `markdown` and `cli` features are for: the Typst plugin builds this crate
# with `default-features = false` and carries neither.

# `required-features` makes cargo SKIP this target in a `--no-default-features`
# build rather than fail to compile it — the arrangement `earthsci-ast` uses
# for its `esm` binary.
[[bin]]
name = "esm-narrative"
path = "src/bin/esm-narrative.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["markdown", "dep:clap"]
markdown = ["dep:serde_yaml_ng"]

[dependencies]
earthsci-ast = { path = "../earthsci-ast-rs", default-features = false, features = ["solve"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
# A container directive's body is YAML, so a test or an analysis is written in
# the esm-spec §6.6 / §6.7 shapes without JSON's punctuation. `serde_yaml_ng`
# is the maintained continuation of `serde_yaml`, archived in 2024.
serde_yaml_ng = { version = "0.10", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
