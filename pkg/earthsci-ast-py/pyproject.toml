[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthsci-ast"
version = "0.2.0"
description = "Earth System Model Serialization Format"
authors = [
    {name = "EarthSciML Authors and Contributors"}
]
readme = "README.md"
keywords = ["earth-science", "modeling", "serialization", "atmospheric-chemistry", "climate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Chemistry",
]
license = {file = "LICENSE"}
requires-python = ">=3.9"

# The BASE install is the format library: parse / validate / serialize /
# display / canonicalize / graph / edit / flatten / classify, plus expression
# evaluation. Nothing here reads a data file off a URL, so nothing here needs a
# netCDF stack.
#
# xarray / netcdf4 are NOT base dependencies (phase-6 H-4). The comment they
# replace claimed "the IO tier hard-depends on them"; that was measured false —
# no module under `earthsci_ast/` imports either at module scope. `xarray` is
# imported inside `data_sources._xarray._default_xarray_opener`, and `netcdf4`
# is never imported by this package at all: it is the ENGINE xarray selects to
# open a netCDF URL. Both now live in the `data` extra, which is the Python
# analogue of the Rust crate's `esio` feature and of `EarthSciASTEarthSciIOExt`
# in Julia — the opt-in that turns on reading real gridded data.
#
# scipy is NOT a base dependency either: esm-libraries-spec §2.5.9 keeps the
# SOLVER optional in every binding. Building a Problem — load, flatten, provider
# fetch, compile — never touches it; only `solve` / `init` / `step` /
# `solve_all` do, and they report a missing SciPy rather than failing at import.
# It lives in the `simulate` extra (and in `test`, which exercises the solver).
#
# matplotlib is optional for the same shape of reason — used lazily only by
# Solution.plot behind an import guard — so it lives in the `plot` extra.
dependencies = [
    "jsonschema>=4.0",
    "sympy>=1.9",
    "pint>=0.20",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/EarthSciML/EarthSciAST"
Repository = "https://github.com/EarthSciML/EarthSciAST.git"
Documentation = "https://github.com/EarthSciML/EarthSciAST#readme"
Issues = "https://github.com/EarthSciML/EarthSciAST/issues"

[project.optional-dependencies]
# The data-loading tier (phase-6 H-4): `earthsci_ast.data_sources` reading a
# REAL gridded or static source off a URL. The pure-Python parts of that package
# — URL-template expansion, ISO-8601 time resolution, mirror fallback, the cache
# index, unit conversion, and the CSV/JSON `points` loader — need none of this
# and work on the base install; only the xarray-backed `grid` / `static`
# openers do. A missing extra is reported by
# `data_sources._xarray._default_xarray_opener` as an `XarrayLoaderError`
# naming this extra, not as a bare ImportError.
#
# Cross-binding: this is the same seam as the Rust crate's non-default `esio`
# feature and Julia's `EarthSciASTEarthSciIOExt` extension. It is spelled
# `data` rather than `esio` because what it installs is the netCDF reader
# stack (xarray + its netcdf4 engine), NOT EarthSciIO — the Python EarthSciIO
# bridge (`data_sources.esio_provider`) imports `earthsciio` lazily and is
# opt-in by virtue of never being declared here at all.
data = [
    "xarray>=0.20",
    "netcdf4>=1.5",
]
# The solver (esm-libraries-spec §2.5.9). `esm_problem` never needs it; `solve`,
# `init`, `step` and `solve_all` do.
simulate = [
    "scipy>=1.7",
]
# Plotting is optional: only Solution.plot imports matplotlib, lazily and
# behind an import guard, so the core toolkit never requires it.
plot = [
    "matplotlib>=3.5",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=3.0",
    "ruff>=0.4",
    "mypy>=0.990",
    "build>=0.8",
    "twine>=4.0",
]
# The cross-language conformance ADAPTERS (determinism, cadence, PDE
# simulation). These are development tooling, not a product surface: `esm` (the
# Rust binary) is the only command-line tool this project ships, so the adapters
# are NOT installed as console scripts. They are run as modules:
#
#     python3 -m earthsci_ast.cli.determinism_adapter    --manifest M --output O
#     python3 -m earthsci_ast.cli.cadence_adapter        --manifest M --output O
#     python3 -m earthsci_ast.cli.pde_simulation_adapter --manifest M --output O
#
# The harness (scripts/conformance_lib.py, AdapterHarness.discover) resolves an
# adapter from `$EARTHSCI_<SUITE>_ADAPTER_<BINDING>` FIRST and only then falls
# back to probing PATH for `earthsci-<suite>-adapter-<binding>`. Every Python
# producer in scripts/test-conformance.sh sets that variable to the `python3 -m`
# form above, with PYTHONPATH pinned to this worktree's src -- deliberately, so
# the adapter runs THIS checkout rather than whatever a stray install left on
# PATH. Dropping the console scripts therefore changes nothing the harness uses,
# and removes a way to accidentally conformance-test the wrong code.
conformance = [
    "numpy>=1.20",
    # The PDE-simulation adapter integrates trajectories with scipy solve_ivp.
    "scipy>=1.7",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=3.0",
    # The test suite integrates real problems end to end (esm-libraries-spec
    # §2.4.2), so the optional solver is a TEST dependency here.
    "scipy>=1.7",
    # The loader tests open real netCDF fixtures through the xarray openers, so
    # the `data` extra's contents are TEST dependencies here too (phase-6 H-4).
    "xarray>=0.20",
    "netcdf4>=1.5",
    # Required for jsonschema FormatChecker to validate date-time and uri formats
    "rfc3339-validator",
    "rfc3986-validator",
    # Property-based / fuzz testing (gt-72z)
    "hypothesis>=6.0",
]
# Conservative-regridding geometry kernel (RFC semiring-faq-unified-ir §8.1 /
# Appendix B.2; bead ess-my4.4.4). The `intersect_polygon` leaf's spherical /
# geodesic manifolds clip on the sphere via `spherely` (vectorized S2 bindings
# over s2geography). `spherely` is PRE-1.0 — its Python API still moves between
# releases — so it is PINNED here and imported lazily by
# `earthsci_ast.geometry`; the stable surface beneath it is the
# s2geography / s2geometry C++ API. Track spherely releases and bump this pin
# deliberately. The `planar` manifold needs no backend (numpy-only
# Sutherland–Hodgman), so the rest of the toolkit never requires this extra.
geometry = [
    "spherely==0.1.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
earthsci_ast = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# I (isort), UP (pyupgrade), B (bugbear), C4 (comprehensions), RET (return),
# W (pycodestyle warnings) on top of the E/F correctness defaults. The typing
# modernization (UP006/UP045) is safe because every module carries
# `from __future__ import annotations`.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RET", "W"]
ignore = [
    "E501",   # line length is left to the formatter, not enforced as an error
    "B008",   # function call in argument default (used deliberately in a few APIs)
]

[tool.ruff.lint.isort]
# Every module carries `from __future__ import annotations` so the whole package
# can use PEP 585/604 typing (list[int], X | None) while still importing on 3.9.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests favor readability over lint purity; the package __init__ is a curated
# re-export surface where unused-import / ordering rules do not apply.
"tests/*" = ["B", "E7"]
# __init__ interleaves a conditional (scipy-optional) import block with the
# re-export list, so E402 (import-not-at-top) is expected here.
"src/earthsci_ast/__init__.py" = ["F401", "I001", "E402"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true