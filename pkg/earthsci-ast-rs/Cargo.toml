[package]
name = "earthsci-ast"
version = "0.1.1"
edition = "2024"
rust-version = "1.89.0"
authors = ["EarthSciML Authors and Contributors"]
description = "Rust implementation of EarthSciML Serialization Format"
license = "AGPL-3.0-only"
repository = "https://github.com/EarthSciML/EarthSciAST"
documentation = "https://docs.rs/earthsci-ast"
keywords = ["earth-science", "modeling", "serialization", "json"]
categories = ["science", "parsing", "simulation"]
readme = "README.md"

# Support both library and CLI binary
[[bin]]
name = "esm"
path = "src/bin/esm.rs"
# The CLI depends on clap; without this, a --no-default-features build would
# try (and fail) to compile the binary. With it, cargo simply skips the bin
# target when the `cli` feature is off — no per-item cfg gates needed.
required-features = ["cli"]

[lib]
name = "earthsci_ast"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps JSON object keys in source (insertion) order, so the
# load-time rewrite pass applies `expression_templates` `match` rules in
# template *declaration order* (esm-spec §9.6.3), matching the JS / Python
# bindings whose native maps preserve order.
#
# `float_roundtrip` makes float parsing correctly-rounded (nearest f64), so a
# 16-17-significant-digit JSON literal parses to the SAME bits Julia/Python
# `float(...)` (and Rust `str::parse::<f64>`) produce — the default serde_json
# fast path is 1 ulp off on some such literals (e.g. -104.52369275835723,
# 42.059133583516356), which broke AST byte identity on parse→emit round-trips.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
jsonschema = { version = "0.19", default-features = false }
thiserror = "2.0"
indexmap = { version = "2", features = ["serde"] }
ndarray = "0.16"
# rstar (ess pushdown Phase 3a): a pure-Rust R*-tree for the planar broad-phase
# spatial index behind the overlap join-gate (src/broad_phase.rs). Pure Rust with
# no C/FFI/OS deps, so it cross-compiles CLEAN to wasm32 (the in-browser target) —
# unlike the s2 kernel. Its `AABB` intersection is closed (`<=`/`>=`), matching
# the brute-force oracle exactly (see the `rstar == brute-force` self-conformance
# tests), so the fast path is byte-identical to the reference for a given `eps`.
rstar = "0.13"
# s2rst — the spherical geometry kernel behind the `intersect_polygon` /
# `polygon_area` leaf ops (RFC semiring-faq-unified-ir §8.1; CONFORMANCE_SPEC.md
# §5.8). A PURE-RUST port of Google's s2geometry (S2Builder + S2BooleanOperation +
# the exact predicates), cross-validated in its own suite against C++ and Go
# reference vectors. It replaces the `s2bindings` C++ FFI kernel on EVERY target,
# which is the point: unlike the C++ build it cross-compiles to wasm32, so the
# in-browser engine runs the spherical clip natively instead of marshalling every
# overlap pair out to a separate Emscripten module across the JS boundary. Also
# drops the CMake/abseil/OpenSSL build requirement and the `libs2bindings_shim.so`
# runtime dependency that made the `esm` binary non-relocatable.
#
# Pinned EXACTLY: this crate decides conservative-regridding areas, and its
# upstream is young (0.x, self-described beta). Bump deliberately, and re-check
# the geometry results in `src/geometry.rs` against the s2geometry reference
# vectors when you do — the former `s2-cpp` C++ differential oracle was removed
# when the crate was published to crates.io (git dependencies are not allowed
# there), so there is no longer an in-tree cross-check against C++ S2.
s2rst = "=0.4.0"
# diffsol (gt-5ws) — the ODE simulation backend, on BOTH native and wasm32: its
# Faer backend is pure Rust and cross-compiles (spike S1), so the in-browser
# `simulate` export (src/wasm.rs) can run pure-ODE / 0-D box models client-side.
# diffsol's default features `["nalgebra", "faer"]` are both kept: diffsol 0.11.0's
# lib.rs has unconditional `pub use` of the nalgebra modules even when that feature
# is off (so `default-features = false` fails to compile). The simulate module
# always selects FaerMat / FaerLU at the call site, so we still get the faer path;
# nalgebra is just along for the ride at compile time. The heavyweight optional
# features (LLVM / Cranelift / DiffSL / CUDA / SuiteSparse / Sundials) are excluded.
diffsol = "0.11"
clap = { version = "4.0", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
# Performance dependencies
rayon = { version = "1.8", optional = true }
simd-json = { version = "0.13", optional = true }
smallvec = { version = "1.11", features = ["serde"] }
# Fast, *fixed-seed* (hence deterministic — unlike std's randomized RandomState)
# hasher for the hot per-cell interpreter maps (`simulate_array`). Keys are
# trusted internal variable/index names, so the SipHash DoS resistance is unused
# overhead: the profile of a coupled level-set solve spent ~19% of samples in
# SipHash (`write_u8`/`write_str`/`make_hash`). rustc-hash has zero transitive
# deps. Only lookup-by-key maps are switched (no order-dependent iteration), so
# results are byte-identical.
rustc-hash = "2"
bumpalo = { version = "3.14", optional = true }
wide = { version = "0.7", optional = true }
bytemuck = { version = "1.14", optional = true }
criterion = { version = "0.5", optional = true }
# OPT-IN data-provider bridge (feature `esio`, src/esio_provider.rs). Resolved
# from crates.io, NOT by path: cargo resolves every dependency in the manifest at
# metadata time, optional ones included, so a path into a sibling EarthSciIO
# checkout broke every cargo command on CI, where that checkout does not exist.
# To develop against a local EarthSciIO instead, add to .cargo/config.toml:
#     [patch.crates-io]
#     earthsciio = { path = "../../../EarthSciIO/rust" }
# Optional so the default build neither links EarthSciIO nor inherits its
# netcdf/hdf5 C build requirements.
earthsciio = { version = "0.1", optional = true }
time = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }


# Native-only dev-dependencies. `criterion` pulls `wait-timeout` (whose `imp`
# module is unix/windows-only and fails to compile for wasm32), and
# `proptest` / `tempfile` are filesystem-bound. The wasm test target
# (`tests/wasm_suite.rs`) needs none of them, so gating them off wasm keeps
# `wasm-pack test` from dragging them into the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.10"
# Writes the FF10 zip fixture the loader-ingest test decodes (the same pure-Rust
# `zip` crate EarthSciIO's reader uses; test-only, never a library dependency).
zip = { version = "2", default-features = false, features = ["deflate"] }

# The wasm test harness — drives `tests/wasm_suite.rs` under node/headless-browser
# via `wasm-pack test`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "benchmarks"
harness = false
required-features = ["benchmarks"]

[features]
default = ["cli"]
cli = ["clap"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys", "web-sys"]
# OPT-IN EarthSciIO data-provider bridge (src/esio_provider.rs): a
# `CadenceProvider` delegating to a real `earthsciio::Provider`, so the loader
# seam runs through EarthSciIO's transport + content-addressed cache and can push
# a projection down to a store-backed reader. OFF by default — ESS does not link
# EarthSciIO on the default path (the rigs are deliberately decoupled; the Python
# binding's `esio_provider` is opt-in for the same reason), and EarthSciIO pulls
# netcdf/hdf5 C libraries that would otherwise burden every consumer's build.
esio = ["dep:earthsciio", "dep:time"]
# Performance features
parallel = ["rayon"]
simd = ["wide", "bytemuck"]
zero_copy = ["simd-json"]
custom_alloc = ["bumpalo"]
benchmarks = ["criterion"]
performance = ["parallel", "simd", "zero_copy", "custom_alloc"]

# WASM target configuration
[package.metadata.wasm-pack.profile.release]
