Catalyst = "16, 17.0"
DiffEqCallbacks = "4"
DomainSets = "0.7, 0.8"
LinearAlgebra = "1.10"
Printf = "1.10"
JSON3 = "1"
JSONSchema = "1"
ModelingToolkit = "11"
# HELD BACK DELIBERATELY. ModelingToolkitBase is a weak dependency only so that
# this cap applies wherever it is installed; no extension loads it directly.
# Releases after 1.42 (all of which need SciMLBase 3) break the ModelingToolkit
# extension: `mtkcompile` refuses the array equations it builds ("... is present
# in the system but ... is not an unknown"), discrete events fail
# initialization, and states no equation mentions are dropped. Until SciMLBase 3
# was allowed, the SciMLBase cap held ModelingToolkitBase at 1.42 implicitly;
# this keeps that while letting environments without ModelingToolkit move to
# SciMLBase 3. 1.31 - 1.42 accept both SciMLBase 2 and 3. Lift once the
# extension works on current ModelingToolkitBase.
ModelingToolkitBase = "1 - 1.42"
OrderedCollections = "1, 2"
Polyester = "0.7"
PrecompileTools = "1"
OrdinaryDiffEqNonlinearSolve = "1, 2"
OrdinaryDiffEqRosenbrock = "1, 2"
OrdinaryDiffEqTsit5 = "1, 2"
Reactant = "0.2"
RuntimeGeneratedFunctions = "0.5"
SHA = "0.7, 1"
SciMLBase = "2, 3"
Serialization = "1.10"
Symbolics = "7"
# HELD BACK DELIBERATELY. SymbolicUtils 4.46.0 deleted
#   Base.ImmutableDict(d::ImmutableDict{K,V}, x, y) = ImmutableDict{K,V}(d, x, y)
# from src/types.jl. Base has never defined that 3-argument form -- only the
# Pair-taking one -- and Symbolics 7.x calls it in `renamed_metadata`
# (src/variable.jl), which ModelingToolkitBase's PrecompileTools workload reaches
# through complete -> Initial -> default_toterm -> diff2term -> rename. So 4.46.0
# makes ModelingToolkit fail to PRECOMPILE, taking Catalyst and both EarthSciAST
# MTK extensions down with it. Every SymbolicUtils through 4.45.0 carries the
# method, and no Symbolics release has adapted yet (7.36.0 is current). Lift this
# once Symbolics stops calling the 3-arg form, or SymbolicUtils restores it.
# SymbolicUtils stays in [extras] (but out of the test target) only so this
# entry remains a legal compat entry; the environment that installs
# ModelingToolkit for tests, test/mtk/Project.toml, restates the cap.
SymbolicUtils = "4 - 4.45"
Tullio = "0.3.9"
Unitful = "1.28.0"
julia = "1.10"
# Test-only deps for the EarthSciIO-extension pushdown tests (test/provider_selection_test.jl).
Blosc = "0.7"
# 0.3 is the first release with `provider_from_esm` (EarthSciML/EarthSciIO#30),
# which `providers_from_document` builds every source with.
EarthSciIO = "0.4"
JSON = "1"
SnoopCompileCore = "3"
ZipFile = "0.10"

