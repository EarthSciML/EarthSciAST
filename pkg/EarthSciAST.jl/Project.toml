[targets]
# No ModelingToolkit, Catalyst, Symbolics, SymbolicUtils or DomainSets: every
# test that needs them is in test/mtk/, a separate suite with its own
# environment (test/mtk/Project.toml) that .github/workflows/mtk-compiler.yml
# runs. Adding one of them back here would make every `Pkg.test()` resolve and
# precompile the SciML symbolic stack again.
test = ["Test", "Logging", "BenchmarkTools", "ComponentArrays", "ForwardDiff", "DiffEqCallbacks", "OrdinaryDiffEqNonlinearSolve", "OrdinaryDiffEqRosenbrock", "OrdinaryDiffEqTsit5", "Pkg", "Random", "Reactant", "SciMLBase", "EarthSciIO", "Blosc", "JSON", "SnoopCompileCore", "ZipFile"]
