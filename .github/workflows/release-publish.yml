name: Release Publish

# Consolidated release/publish workflow (gt-567, phase 2 of gt-9ju).
# Absorbs the publish/release jobs previously living in per-language CI files:
#   python-package.yml, julia-ci.yml, rust-ci.yml, go-ci.yml, npm-publish.yml.
# Test matrices from those files were absorbed earlier by gt-9ju into
# conformance-testing.yml; only publish/release logic is handled here.

on:
  # A release created by the integrated pipeline uses GITHUB_TOKEN, and GitHub
  # deliberately does NOT start new workflow runs from GITHUB_TOKEN-triggered
  # events -- so neither `release: published` nor `push: tags` fires in that
  # case. The pipeline therefore calls this workflow directly via workflow_call.
  # The release/tag triggers are kept for releases a human creates by hand,
  # which DO trigger normally.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true
        type: string
  release:
    types: [ published ]
  push:
    tags: [ 'v*' ]

jobs:
  # ---------------------------------------------------------------------------
  # NOTE: Python/PyPI is deliberately NOT published from this workflow. PyPI's
  # trusted publishing does not support reusable workflows: the OIDC exchange
  # matches `job_workflow_ref` (this file) while PEP 740 attestations match
  # `workflow_ref` (whichever workflow called it), and no single publisher
  # configuration satisfies both. The PyPI job therefore lives directly in
  # integrated-release-pipeline.yml. See RELEASING.md.
  # ---------------------------------------------------------------------------
  julia-register:
    runs-on: ubuntu-latest
    if: >-
      inputs.version != ''
      || (github.event_name == 'release' && github.event.action == 'published')
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      # Julia General registration is NOT automated here, deliberately.
      #
      # The previous implementation called julia-actions/RegisterAction with
      # `registry:` and `package_dir:` inputs -- neither of which that action
      # accepts (it takes only `token` and `registrator`), so both were silently
      # ignored. Since EarthSciAST.jl lives in a subdirectory, Registrator would
      # have looked for a Project.toml at the repo root and registered the wrong
      # package, or nothing at all.
      #
      # Registering a subdirectory package requires the `subdir=` argument, which
      # is only expressible through a JuliaRegistrator comment. So the release
      # prints the exact comment to post; see RELEASING.md.
      - name: Julia registration instructions
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"; VERSION="${VERSION#v}"
          {
            echo "## Julia registration (manual step)"
            echo ""
            echo "EarthSciAST.jl v$VERSION is ready to register."
            echo ""
            echo "Comment the following on the release commit"
            echo "(https://github.com/${{ github.repository }}/commit/${{ github.sha }}):"
            echo ""
            echo '```'
            echo "@JuliaRegistrator register subdir=pkg/EarthSciAST.jl"
            echo '```'
            echo ""
            echo "This requires the JuliaRegistrator GitHub App to be installed on the repository."
            echo "New packages sit in a 3-day AutoMerge waiting period in the General registry."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Rust: publish to crates.io and attach cross-platform binaries.
  # ---------------------------------------------------------------------------
  rust-publish:
    runs-on: ubuntu-latest
    if: >-
      inputs.version != ''
      || (github.event_name == 'release' && github.event.action == 'published')
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build for release
        working-directory: pkg/earthsci-ast-rs
        # NOT --all-features: `esio` resolves earthsciio through a path into the
        # sibling EarthSciIO checkout, which does not exist on a CI runner, and
        # `wasm` targets a different architecture. Default features are what the
        # released `esm` binary ships with.
        run: cargo build --release

      - name: Publish to crates.io
        working-directory: pkg/earthsci-ast-rs
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"; VERSION="${VERSION#v}"
          # Publishing is not idempotent: crates.io rejects a version that
          # already exists, and a version can never be reused. Treat "already
          # there" as success so re-running a release, or releasing a version
          # that was published by hand, does not fail the pipeline.
          if curl -sf -o /dev/null \
               -H "User-Agent: EarthSciAST release (github.com/EarthSciML/EarthSciAST)" \
               "https://crates.io/api/v1/crates/earthsci-ast/$VERSION"; then
            echo "::notice::earthsci-ast $VERSION is already on crates.io — skipping publish."
            exit 0
          fi
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Build binary assets
        working-directory: pkg/earthsci-ast-rs
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-apple-darwin
          rustup target add x86_64-pc-windows-gnu

          cargo build --release --target x86_64-unknown-linux-gnu --bin esm
          cargo build --release --target x86_64-apple-darwin --bin esm
          cargo build --release --target x86_64-pc-windows-gnu --bin esm

          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/esm dist/esm-linux-x86_64
          cp target/x86_64-apple-darwin/release/esm dist/esm-macos-x86_64
          cp target/x86_64-pc-windows-gnu/release/esm.exe dist/esm-windows-x86_64.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: pkg/earthsci-ast-rs/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Go: cross-platform binaries + module tagging / index trigger.
  # ---------------------------------------------------------------------------
  go-build-release:
    runs-on: ubuntu-latest
    if: >-
      inputs.version != ''
      || (github.event_name == 'release' && github.event.action == 'published')
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Update version
        working-directory: pkg/earthsci-ast-go
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"; VERSION="${VERSION#v}"
          echo "Building version: $VERSION"
          sed -i "s/Version = \"[^\"]*\"/Version = \"$VERSION\"/" pkg/esm/version.go 2>/dev/null || true

      - name: Build for multiple platforms
        working-directory: pkg/earthsci-ast-go
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"; VERSION="${VERSION#v}"
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o esm-go-linux-amd64 ./main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o esm-go-darwin-amd64 ./main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o esm-go-darwin-arm64 ./main.go
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o esm-go-windows-amd64.exe ./main.go

      - name: Create release assets
        working-directory: pkg/earthsci-ast-go
        run: |
          mkdir -p dist
          mv esm-go-* dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: pkg/earthsci-ast-go/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-publish-module:
    runs-on: ubuntu-latest
    if: >-
      inputs.version != ''
      || (github.event_name == 'release' && github.event.action == 'published')
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Tag Go module
        working-directory: pkg/earthsci-ast-go
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"; VERSION="${VERSION#v}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "pkg/earthsci-ast-go/v$VERSION" -m "Go module v$VERSION"
          git push origin "pkg/earthsci-ast-go/v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GOPROXY
        run: echo "GOPROXY=https://proxy.golang.org,direct" >> $GITHUB_ENV

      - name: Trigger module indexing
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name || github.ref_name }}"; VERSION="${VERSION#v}"
          MODULE_PATH="github.com/EarthSciML/EarthSciAST/pkg/earthsci-ast-go"
          curl -X GET "https://proxy.golang.org/$MODULE_PATH/@v/v$VERSION.info" || true

  # ---------------------------------------------------------------------------
  # npm: publish stable on v* tags, publish beta on any tag / release event.
  # ---------------------------------------------------------------------------
  npm-publish:
    runs-on: ubuntu-latest
    if: >-
      inputs.version != ''
      || (github.event_name == 'release' && github.event.action == 'published')
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: pkg/earthsci-ast-ts/package-lock.json

      - name: Install dependencies
        working-directory: pkg/earthsci-ast-ts
        run: npm ci

      - name: Build package
        working-directory: pkg/earthsci-ast-ts
        run: npm run build

      - name: Publish to NPM
        working-directory: pkg/earthsci-ast-ts
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
