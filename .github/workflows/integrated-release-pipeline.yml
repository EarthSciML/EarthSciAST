name: Integrated Release Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
    - 'workspace.json'
    - 'COMPATIBILITY.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Re-run publishing for the current manifest version even if its tag already exists (recovers a partially-published release)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  # Analyze what needs to be released
  release-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      needs_release: ${{ steps.analysis.outputs.needs_release }}
      new_version: ${{ steps.analysis.outputs.new_version }}
      tag_exists: ${{ steps.analysis.outputs.tag_exists }}
      release_notes: ${{ steps.analysis.outputs.release_notes }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Lowercase registry namespace
      run: echo "NAMESPACE=${NAMESPACE,,}" >> $GITHUB_ENV

    - name: Release analysis
      id: analysis
      run: |
        set -euo pipefail

        # The package manifests are the SINGLE SOURCE OF TRUTH for the release
        # version. The previous implementation guessed a version by bumping the
        # last git tag according to commit-message keywords, which was wrong in
        # three separate ways:
        #   * `git describe` finds no reachable tag (history was rebased), so it
        #     silently fell back to v0.0.0 and re-derived every release from zero;
        #   * a single `!:` anywhere in the log forced a major bump, so the first
        #     release would have been v1.0.0 regardless of what the manifests said;
        #   * it then rewrote the manifests to match its guess and committed that
        #     to main, racing every human push.
        # Reading the version out of the manifests instead makes the release
        # reproducible and lets a human decide the number in a reviewed commit.
        VERSION=$(grep -m1 '^version = ' pkg/EarthSciAST.jl/Project.toml | sed 's/.*"\(.*\)".*/\1/')
        echo "Manifest version: $VERSION"

        # Every binding must agree, or we would publish five different versions
        # under one tag.
        PY_VERSION=$(grep -m1 '^version = ' pkg/earthsci-ast-py/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
        RS_VERSION=$(grep -m1 '^version = ' pkg/earthsci-ast-rs/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
        TS_VERSION=$(node -p "require('./pkg/earthsci-ast-ts/package.json').version")

        MISMATCH=""
        for pair in "julia:$VERSION" "python:$PY_VERSION" "rust:$RS_VERSION" "typescript:$TS_VERSION"; do
          name=${pair%%:*}; got=${pair#*:}
          if [ "$got" != "$VERSION" ]; then
            MISMATCH="$MISMATCH $name=$got"
          fi
        done
        if [ -n "$MISMATCH" ]; then
          echo "::error::Package versions disagree (expected $VERSION):$MISMATCH"
          exit 1
        fi
        echo "All bindings agree on $VERSION"

        echo "new_version=$VERSION" >> $GITHUB_OUTPUT

        # Already released? Then this push is ordinary work, not a release --
        # unless a human explicitly asked to re-publish, which is how a
        # half-published release gets finished without burning a version number.
        FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}"
        if git rev-parse "v$VERSION" >/dev/null 2>&1; then
          if [ "$FORCE" = "true" ]; then
            echo "::notice::Tag v$VERSION exists; force_release set — re-publishing."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "needs_release=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Tag v$VERSION already exists — no release for this push."
            echo "needs_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        else
          echo "tag_exists=false" >> $GITHUB_OUTPUT
          echo "needs_release=true" >> $GITHUB_OUTPUT
        fi

        # Changelog range: the previous release tag if there is one, else the
        # last 50 commits. An unbounded log over all history produced a release
        # body so large it blew the argv limit in the finalize step.
        PREV_TAG=$(git tag -l 'v*' --sort=-v:refname)
        PREV_TAG=${PREV_TAG%%$'\n'*}
        if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
          RANGE="$PREV_TAG..HEAD"
        else
          RANGE=""
        fi

        {
          echo "release_notes<<ESM_RELEASE_NOTES_EOF"
          echo "# Release v$VERSION"
          echo ""
          echo "## Changes"
          echo ""
          if [ -n "$RANGE" ]; then
            git log "$RANGE" -n 100 --pretty=format:"- %s (%h)" --no-merges
          else
            git log --pretty=format:"- %s (%h)" --no-merges -n 50
          fi
          echo ""
          echo ""
          echo "## Installation"
          echo ""
          echo '```bash'
          echo 'using Pkg; Pkg.add("EarthSciAST")   # Julia'
          echo 'npm install @earthsciml/ast          # TypeScript'
          echo 'pip install earthsci-ast             # Python'
          echo 'cargo add earthsci-ast               # Rust'
          echo 'go get github.com/EarthSciML/EarthSciAST/pkg/earthsci-ast-go'
          echo '```'
          echo "ESM_RELEASE_NOTES_EOF"
        } >> $GITHUB_OUTPUT

  # Security scan before release
  security-scan:
    needs: release-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.release-analysis.outputs.needs_release == 'true'
    outputs:
      security_status: ${{ steps.security_check.outputs.status }}
      vulnerabilities_found: ${{ steps.security_check.outputs.vulnerabilities }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        pip install --upgrade pip
        pip install safety toml requests urllib3

    - name: Run pre-release security scan
      id: security_check
      run: |
        echo "Running pre-release security scan..."

        # Run security scanner
        python3 scripts/package-security-scanner.py \
          --config .security-config.json \
          --output pre-release-security-scan.json

        SCAN_EXIT_CODE=$?

        # Check for critical vulnerabilities
        CRITICAL_VULNS=$(python3 -c "
        import json
        try:
            with open('pre-release-security-scan.json', 'r') as f:
                data = json.load(f)
            critical_count = 0
            for pkg in data.get('packages', {}).values():
                for vuln in pkg.get('vulnerabilities', []):
                    if vuln.get('severity', '').lower() in ['critical', 'high']:
                        critical_count += 1
            print(critical_count)
        except:
            print(0)
        ")

        echo "Critical vulnerabilities found: $CRITICAL_VULNS"
        echo "vulnerabilities=$CRITICAL_VULNS" >> $GITHUB_OUTPUT

        if [ "$CRITICAL_VULNS" -gt 0 ]; then
          echo "status=blocked" >> $GITHUB_OUTPUT
          echo "❌ Release blocked due to $CRITICAL_VULNS critical vulnerabilities"
          exit 1
        else
          echo "status=passed" >> $GITHUB_OUTPUT
          echo "✅ Security scan passed, proceeding with release"
          exit 0
        fi

    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pre-release-security-scan-${{ github.run_id }}
        path: pre-release-security-scan.json
        retention-days: 90

  # Create the release
  create-release:
    needs: [release-analysis, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.release-analysis.outputs.needs_release == 'true' && needs.security-scan.outputs.security_status == 'passed' && needs.release-analysis.outputs.tag_exists != 'true'
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.release-analysis.outputs.new_version }}
        name: Release v${{ needs.release-analysis.outputs.new_version }}
        body: ${{ needs.release-analysis.outputs.release_notes }}
        draft: false
        prerelease: ${{ contains(needs.release-analysis.outputs.new_version, '-') }}


  # Python/PyPI is published from THIS workflow, not from release-publish.yml.
  # PyPI's trusted publishing does not support reusable workflows: the OIDC
  # exchange matches `job_workflow_ref` (the reusable file) while PEP 740
  # attestations match `workflow_ref` (the caller), so a publisher naming either
  # one fails the other check. Publishing from a non-reusable workflow makes the
  # two claims identical and the match unambiguous.
  publish-pypi:
    needs: [release-analysis, security-scan, create-release]
    if: always() && needs.release-analysis.outputs.needs_release == 'true' && needs.security-scan.outputs.security_status == 'passed' && needs.create-release.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/earthsci-ast
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and check distributions
        working-directory: pkg/earthsci-ast-py
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/earthsci-ast-py/dist
          # PyPI refuses a version that already exists; let a re-run be a no-op.
          skip-existing: true

  # Publish to the package registries. This is CALLED, not left to fire on the
  # `release: published` event: that release is created with GITHUB_TOKEN, and
  # GitHub does not start new workflow runs from GITHUB_TOKEN-triggered events,
  # so an event-driven release-publish.yml would never have run.
  publish-packages:
    needs: [release-analysis, security-scan, create-release]
    if: always() && needs.release-analysis.outputs.needs_release == 'true' && needs.security-scan.outputs.security_status == 'passed' && needs.create-release.result != 'failure'
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.release-analysis.outputs.new_version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  # Build cross-platform binaries
  build-binaries:
    needs: [release-analysis, security-scan, create-release]
    if: needs.release-analysis.outputs.needs_release == 'true' && needs.security-scan.outputs.security_status == 'passed'
    uses: ./.github/workflows/binary-release.yml
    with:
      version: v${{ needs.release-analysis.outputs.new_version }}
    secrets: inherit

  # Run comprehensive conformance testing (reuses the consolidated workflow)
  run-conformance-tests:
    needs: [release-analysis, security-scan, create-release]
    if: needs.release-analysis.outputs.needs_release == 'true' && needs.security-scan.outputs.security_status == 'passed'
    uses: ./.github/workflows/conformance-testing.yml
    with:
      release_validation: true
      ref: v${{ needs.release-analysis.outputs.new_version }}
    secrets: inherit

  # Update release with final assets and status
  finalize-release:
    needs: [
      release-analysis,
      security-scan,
      create-release,
      build-binaries,
      run-conformance-tests
    ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always() && needs.release-analysis.outputs.needs_release == 'true'
    steps:
    - uses: actions/checkout@v4

    # Release coordination status is per-run metadata, so it is reported to the
    # job summary rather than committed. Committing it back to main raced with
    # every human push and made workspace.json conflict on every merge.
    - name: Report release coordination status
      run: |
        NEW_VERSION="${{ needs.release-analysis.outputs.new_version }}"

        # Determine final release status
        RELEASE_STATUS="success"
        if [ "${{ needs.build-binaries.result }}" != "success" ] || \
           [ "${{ needs.run-conformance-tests.result }}" != "success" ]; then
          RELEASE_STATUS="partial"
        fi

        {
          echo "## Release coordination — v$NEW_VERSION"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Status | \`$RELEASE_STATUS\` |"
          echo "| Completed | $(date -Iseconds) |"
          echo "| Binaries | \`${{ needs.build-binaries.result }}\` |"
          echo "| Conformance | \`${{ needs.run-conformance-tests.result }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Update release notes with final status
      uses: actions/github-script@v7
      env:
        RELEASE_NOTES: ${{ needs.release-analysis.outputs.release_notes }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const version = "${{ needs.release-analysis.outputs.new_version }}";
          let releaseId = "${{ needs.create-release.outputs.release_id }}";

          // If create-release was skipped, try to find the release by tag
          if (!releaseId) {
            const tag = `v${version}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              releaseId = String(release.id);
              core.info(`Found existing release ${releaseId} for tag ${tag}`);
            } catch (e) {
              core.warning(`No release found for tag ${tag} and create-release was skipped. Skipping release notes update.`);
              return;
            }
          }

          // Build status summary
          const statusEmoji = {
            'success': '✅',
            'failure': '❌',
            'skipped': '⏭️',
            'cancelled': '🚫'
          };

          const binariesStatus = statusEmoji['${{ needs.build-binaries.result }}'] || '❓';
          const conformanceStatus = statusEmoji['${{ needs.run-conformance-tests.result }}'] || '❓';

          const originalBody = process.env.RELEASE_NOTES || '';

          const statusSection = `

          ## 🚀 Release Status

          | Component | Status |
          |-----------|--------|
          | Cross-Platform Binaries | ${binariesStatus} ${{ needs.build-binaries.result }} |
          | Conformance Tests | ${conformanceStatus} ${{ needs.run-conformance-tests.result }} |

          **Release Quality**: ${binariesStatus === '✅' && conformanceStatus === '✅' ? '🟢 Production Ready' : '🟡 Review Required'}

          ---

          📊 [View detailed pipeline logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;

          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: parseInt(releaseId),
            body: originalBody + statusSection
          });

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Release Pipeline Failed for v${{ needs.release-analysis.outputs.new_version }}`,
            body: `The automated release pipeline failed for version v${{ needs.release-analysis.outputs.new_version }}.

            **Workflow Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Status Summary**:
            - Binaries: ${{ needs.build-binaries.result }}
            - Conformance: ${{ needs.run-conformance-tests.result }}

            Please review the logs and re-run the failed components manually if needed.`,
            labels: ['release', 'ci/cd', 'bug']
          });