name: Lint

# Format and lint gate from the shared workflow in EarthSciML/.github, which
# pins the tool versions. This repository's rules live in each package's own
# config: pkg/earthsci-ast-py/pyproject.toml and ruff.toml, the crates'
# Cargo.toml, pkg/earthsci-ast-ts/eslint.config.js, and formal/lakefile.toml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: EarthSciML/.github/.github/workflows/lint.yml@main
    with:
      rust-dirs: '["pkg/earthsci-ast-rs", "pkg/earthsci-narrative", "pkg/earthsci-typst-plugin"]'
      # Every earthsci-ast-rs feature except `xla`, whose build script needs a
      # separately fetched xla_extension (tested in xla-backends.yml); plus the
      # aarch64 SIMD paths, which the host build does not compile. Those live in
      # the library, so that run lints `--lib` only: its tests and benches pull
      # in dev-dependencies with C build scripts (criterion's `alloca`), and the
      # runner has no aarch64 C compiler. The Typst plugin only builds for wasm32
      # (its .cargo/config.toml sets the target).
      rust-clippy: >-
        [{"dir": "pkg/earthsci-ast-rs", "args": "--features conformance-adapters,wasm,parallel,simd,zero_copy,custom_alloc,benchmarks,performance,esio"},
         {"dir": "pkg/earthsci-ast-rs", "target": "aarch64-unknown-linux-gnu", "targets": "--lib", "args": "--features simd"},
         {"dir": "pkg/earthsci-narrative"},
         {"dir": "pkg/earthsci-typst-plugin", "target": "wasm32-unknown-unknown"}]
      python-dir: pkg/earthsci-ast-py
      python-paths: src tests ../../scripts
      ts-dir: pkg/earthsci-ast-ts
      go-dir: pkg/earthsci-ast-go
      lean-dir: formal
      julia-paths: "."
