name: Formal model (Lean)

# Builds the Lean model of the spec in `formal/` and runs its audit gate
# (`scripts/formal-audit.py`), then scores the model's adapter on the tiers
# it covers: the standard-library template tiers (interp, datetime, relational,
# geometry). A mismatch there fails the job (formal/README.md). Every .esm under
# tests/ also goes through the document source formats: printed as Markdown and
# Typst and read back, the Typst compiled with the repository's `esm` Typst
# package, and the Markdown's math rendered with KaTeX.
#
# The spec files are in `paths` because the inventory audit checks that every
# MUST clause is accounted for and that every citation still resolves: a spec
# edit that adds a clause or moves a cited sentence must update `formal/` in
# the same PR.

on:
  push:
    branches: [ main ]
    paths:
      - 'formal/**'
      - 'lib/interp.esm'
      - 'lib/calendar.esm'
      - 'lib/relational.esm'
      - 'lib/geometry.esm'
      - 'esm-spec.md'
      - 'CONFORMANCE_SPEC.md'
      - 'scripts/formal-audit.py'
      - 'scripts/run-closed-functions-lean.py'
      - 'scripts/test_run_closed_functions_lean.py'
      - 'scripts/run-inline-tests-conformance.py'
      - 'scripts/run-determinism-conformance.py'
      - 'scripts/conformance_lib.py'
      - 'tests/closed_functions/**'
      - 'tests/conformance/interp_templates/**'
      - 'tests/conformance/datetime_templates/**'
      - 'tests/conformance/relational_templates/**'
      - 'tests/conformance/determinism/**'
      - 'tests/conformance/geometry_templates/**'
      - 'tests/conformance/document_format/**'
      - 'scripts/gen-document-format-fixtures.py'
      - 'tests/**/*.esm'
      - 'typst/packages/**'
      - '.github/workflows/formal.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'formal/**'
      - 'lib/interp.esm'
      - 'lib/calendar.esm'
      - 'lib/relational.esm'
      - 'lib/geometry.esm'
      - 'esm-spec.md'
      - 'CONFORMANCE_SPEC.md'
      - 'scripts/formal-audit.py'
      - 'scripts/run-closed-functions-lean.py'
      - 'scripts/test_run_closed_functions_lean.py'
      - 'scripts/run-inline-tests-conformance.py'
      - 'scripts/run-determinism-conformance.py'
      - 'scripts/conformance_lib.py'
      - 'tests/closed_functions/**'
      - 'tests/conformance/interp_templates/**'
      - 'tests/conformance/datetime_templates/**'
      - 'tests/conformance/relational_templates/**'
      - 'tests/conformance/determinism/**'
      - 'tests/conformance/geometry_templates/**'
      - 'tests/conformance/document_format/**'
      - 'scripts/gen-document-format-fixtures.py'
      - 'tests/**/*.esm'
      - 'typst/packages/**'
      - '.github/workflows/formal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7

    # The inventory and token checks need no Lean, so they run first and
    # report even when the Lean build fails.
    - name: Audit inventory, tokens and notation
      run: |
        python3 scripts/formal-audit.py tokens
        python3 scripts/formal-audit.py notation
        python3 scripts/formal-audit.py inventory

    # The Lean ASTs of the standard-library templates are generated from
    # lib/*.esm; the proofs about them are only about the committed library
    # if the generated file is current.
    - name: Check generated library templates
      run: python3 formal/scripts/gen-lib-templates.py --check

    # The generator's and the scorer's own tests: pure Python, and instant.
    - name: Test the generator and the scorer
      run: |
        python3 formal/scripts/test_gen_lib_templates.py
        python3 scripts/test_run_closed_functions_lean.py

    - name: Cache Lean toolchain
      uses: actions/cache@v6
      with:
        path: ~/.elan
        key: ${{ runner.os }}-elan-${{ hashFiles('formal/lean-toolchain') }}

    - name: Install elan
      run: |
        curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --no-modify-path --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    # The package checkouts (Mathlib and its dependencies) and the prebuilt
    # Mathlib oleans that `cache get` unpacks into them. Keyed on the manifest,
    # which pins every package revision; the model's own build output is not
    # cached, so a stale olean can never stand in for a proof.
    - name: Cache Lake packages
      uses: actions/cache@v6
      with:
        path: formal/.lake/packages
        key: ${{ runner.os }}-lake-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}

    # Prebuilt Mathlib. Building Mathlib from source takes hours; if the cache
    # download fails, fail the job rather than fall back to that.
    - name: Fetch Mathlib cache
      working-directory: formal
      run: lake exe cache get

    - name: Build model
      working-directory: formal
      run: lake build

    - name: Audit registry against the build
      run: python3 scripts/formal-audit.py registry --lean

    # The model as a conformance participant: `esm-lean` on the
    # standard-library template tiers, bit for bit where the tolerance is zero.
    # `lake build` above already built the adapter.
    - name: Score the model on the template tiers
      run: python3 scripts/run-closed-functions-lean.py --no-build

    - name: Score the model on the determinism tier
      env:
        EARTHSCI_DETERMINISM_ADAPTER_LEAN: formal/.lake/build/bin/esm-lean determinism
      run: python3 scripts/run-determinism-conformance.py --bindings lean

    # The document source format golden set is generated by `esm-lean`; a
    # printer or parser change that moves a pinned spelling fails here until
    # the fixtures are regenerated (scripts/gen-document-format-fixtures.py).
    - name: Check the document-format fixtures against the model
      run: python3 scripts/formal-audit.py fixtures

    # The document source formats on the whole corpus: every .esm under tests/
    # that is a JSON object round-trips through Markdown and Typst
    # (`esm-lean print-md|parse-md|print-typ|parse-typ`), every printed .typ
    # compiles with the `esm` package in typst/packages, and every math piece
    # of the printed Markdown renders in KaTeX (strict, with mhchem).
    - name: Install Typst and KaTeX
      run: |
        curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
          https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
        echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
        tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
        npm install --prefix "$RUNNER_TEMP/katex" --no-save --no-audit --no-fund katex@0.16.29
        echo "NODE_PATH=$RUNNER_TEMP/katex/node_modules" >> "$GITHUB_ENV"

    - name: Document formats on the corpus
      run: python3 formal/scripts/doc-corpus.py --typst typst --katex
