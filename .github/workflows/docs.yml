name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'pkg/**'
      - 'docs/**'
      - 'scripts/api_docs/**'
      - 'api-surface.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/api-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/**'
      - 'docs/**'
      - 'scripts/api_docs/**'
      - 'api-surface.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/api-docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docstring extraction and the runnable examples, one job per binding. A
  # failing example fails the run.
  api-docs:
    uses: ./.github/workflows/api-docs.yml
    with:
      strict: true

  build:
    needs: api-docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUGO_VERSION: "0.131.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download extracted docstrings
        uses: actions/download-artifact@v4
        with:
          pattern: api-docs-*
          path: build/api-docs
          merge-multiple: true

      - name: Render API reference and guides
        run: python scripts/api_docs/render.py

      # Every narrative page is assembled, validated, tested and plotted. This
      # is where a broken model in the documentation fails a pull request.
      - name: Build narrative pages
        run: cargo run --manifest-path pkg/earthsci-narrative/Cargo.toml --bin esm-narrative -- build

      - name: Install Hugo extended
        run: |
          curl -sSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin hugo

      - name: Build site with Hugo
        run: hugo --source docs --minify --destination public --baseURL "https://earthsciml.github.io/EarthSciAST/"

      - name: Stage built site for link-checking
        run: |
          mkdir -p "$RUNNER_TEMP/lychee-root/EarthSciAST"
          cp -r docs/public/. "$RUNNER_TEMP/lychee-root/EarthSciAST/"

      - name: Link-check built site (internal links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ runner.temp }}/lychee-root
            --exclude '^https?://'
            --exclude '^mailto:'
            '${{ runner.temp }}/lychee-root/EarthSciAST/**/*.html'
          fail: true
          format: detailed
