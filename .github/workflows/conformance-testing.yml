name: Cross-Language Conformance Testing

on:
  push:
    branches: [ main ]
    paths:
      - 'pkg/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/conformance-testing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/conformance-testing.yml'
  workflow_call:
    inputs:
      release_validation:
        description: 'Run as part of release validation'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref to check out (e.g. a release tag)'
        required: false
        type: string
        default: ''
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  # Cancel superseded runs everywhere, main included. The julia matrix runs
  # ~55 min, so queueing meant each push to main waited out the previous
  # commit's full matrix before testing the code anyone actually cares about.
  # Testing HEAD promptly beats finishing a run whose result is already stale.
  cancel-in-progress: true

env:
  # Consistent versions across jobs
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  JULIA_VERSION: '1.10'
  RUST_VERSION: 'stable'
  # Linter versions are PINNED. An unpinned linter re-lints unchanged code
  # against new rules on every run, so a green commit turns red with no
  # commit behind it -- which is how this workflow drifted red before.
  RUFF_VERSION: '0.16.4'
  GOLANGCI_LINT_VERSION: 'v2.6.2'
  # Same reasoning for clippy, which is a linter like the other two: on a
  # floating `stable` a new rustc turns the gate red with no commit behind it.
  # (It just did -- 1.98 added a for_kv_map finding 1.95 did not make.) The
  # rust-tests matrix below deliberately KEEPS floating stable/beta, because
  # there the point is compile/test coverage against moving toolchains.
  RUST_LINT_VERSION: '1.98.0'
  # Resource limits for conformance testing
  CONFORMANCE_MEMORY_LIMIT: '4g'
  CONFORMANCE_CPU_LIMIT: '2.0'
  CONFORMANCE_TIMEOUT: '300s'

jobs:
  # Every lint and format gate for every language, in ONE job.
  #
  # These used to sit as steps INSIDE each language's test job, ahead of the
  # test steps -- so a single prettier nit or rustfmt diff failed the job
  # before a single test ran, and the real test status stayed invisible. That
  # is how this workflow stayed red for 40 consecutive runs while nobody could
  # see whether the suites underneath actually passed.
  #
  # Split out, the test jobs report test results and this job reports style.
  # It also de-duplicates work: rust lint ran 3x across its matrix, python 4x,
  # typescript 2x. Here each runs once.
  #
  # Every gate below carries `if: ${{ !cancelled() }}` so that ONE failing
  # linter does not skip the ones after it. Steps run in sequence and a failed
  # step normally short-circuits the rest, which meant a dirty `cargo fmt` --
  # cosmetic and self-fixing -- silently skipped `cargo clippy`, eslint,
  # prettier, gofmt, golangci-lint and the version-sync check: one reported
  # failure, while three other languages' substantive linters and the
  # cross-binding version check were never consulted at all (#217). The job
  # still fails if any gate fails; it just consults all of them first, so one
  # push surfaces every finding instead of one finding per round trip.
  #
  # `!cancelled()` rather than `always()`: this workflow sets
  # `cancel-in-progress: true`, and `always()` would keep running lint steps
  # through a cancellation instead of letting the superseded run stop.
  #
  # The `Setup *` / cache steps above deliberately have NO condition: those are
  # infrastructure, and linting against a toolchain that failed to install
  # produces noise, not signal. (A failure there still leaves the other
  # languages' gates to run, since they carry the condition.)
  lint:
    name: Lint and format (all languages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pkg/earthsci-ast-ts/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: pkg/earthsci-ast-go/go.sum

      - name: Setup Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_LINT_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/earthsci-ast-rs/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('pkg/earthsci-ast-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      # --- Python -------------------------------------------------------
      - name: Install ruff (pinned)
        if: ${{ !cancelled() }}
        run: pip install "ruff==${RUFF_VERSION}"

      - name: ruff check / ruff format
        if: ${{ !cancelled() }}
        working-directory: pkg/earthsci-ast-py
        run: |
          # Config lives in the repo-root ruff.toml.
          ruff check src/ tests/ ../../scripts/
          ruff format --check src/ tests/ ../../scripts/

      # --- Rust ---------------------------------------------------------
      - name: cargo fmt
        if: ${{ !cancelled() }}
        working-directory: pkg/earthsci-ast-rs
        run: cargo fmt --all -- --check

      # Default features only, deliberately. `--all-features` (what this step
      # used to say) did not COMPILE for a long time -- and because the clippy
      # step sat behind the rustfmt gate (#217, fixed by the conditions on
      # these steps), it did not actually run in CI for 40+ runs, so the rot
      # went unseen. There were two blockers: `esio` against an earthsciio 0.1
      # with no `DataSource`/`SourceTemporal`, and ~14 `performance` call sites
      # passing `ExpressionNode` where `Expr::Operator` wanted
      # `Arc<ExpressionNode>`.
      #
      # BOTH are now fixed -- `cargo check --all-features` builds clean, which
      # is what the `rust-tests` matrix and the bench-check step below rely on.
      # Widening this back out is therefore possible but is NOT a free change:
      # `esio_provider` and `performance` have never once been linted, so it
      # would surface a fresh backlog under `-D warnings`. Do it as its own
      # change, with the findings triaged, rather than as a drive-by.
      #
      # Note also that `--all-targets` on the default feature set does NOT
      # cover `benches/benchmarks.rs`: that target is `required-features =
      # ["benchmarks"]`, which is off by default. The bench target's COMPILE is
      # checked in `rust-tests` instead (#218).
      - name: cargo clippy
        if: ${{ !cancelled() }}
        working-directory: pkg/earthsci-ast-rs
        run: cargo clippy --all-targets -- -D warnings

      # --- TypeScript ---------------------------------------------------
      - name: Install TypeScript dependencies
        if: ${{ !cancelled() }}
        working-directory: pkg/earthsci-ast-ts
        run: npm ci

      - name: eslint / prettier
        if: ${{ !cancelled() }}
        working-directory: pkg/earthsci-ast-ts
        run: |
          npm run lint
          npm run format:check

      # --- Go -----------------------------------------------------------
      - name: gofmt
        if: ${{ !cancelled() }}
        working-directory: pkg/earthsci-ast-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi

      - name: golangci-lint (pinned)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: pkg/earthsci-ast-go

      # --- Cross-binding ------------------------------------------------
      # Six files carry the one release version; two of them are hand-kept
      # mirrors with no manifest to derive from. v0.2.0 published with both
      # mirrors stale. Cheap to check, so check it on every run.
      - name: Version sync (all bindings)
        if: ${{ !cancelled() }}
        run: ./scripts/check-version-sync.sh

  # Run each language's individual tests first.
  # Matrices absorbed from the per-language CI workflows (gt-9ju):
  #   python-package.yml, rust-ci.yml, julia-ci.yml, go-ci.yml, npm-publish.yml
  julia-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12', '1.13']
    defaults:
      run:
        working-directory: pkg/EarthSciAST.jl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install Julia dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Run Julia tests (with coverage)
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process Julia coverage
        uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1.12'
        with:
          directories: pkg/EarthSciAST.jl/src

      - name: Upload Julia coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.julia-version == '1.12'
        with:
          files: lcov.info
          flags: julia

  typescript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: pkg/earthsci-ast-ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: pkg/earthsci-ast-ts/package-lock.json

      - name: Install TypeScript dependencies
        run: npm ci

      - name: Typecheck TypeScript package
        run: npm run typecheck

      - name: Build TypeScript package
        run: npm run build

      - name: Run TypeScript tests
        run: npm run test:ci

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: pkg/earthsci-ast-py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pkg/earthsci-ast-py/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-cov
          pip install -e .[dev,test]

      - name: Run Python tests (with coverage)
        run: |
          pytest tests/ -v --cov=src/earthsci_ast --cov-report=xml

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11'
        with:
          files: pkg/earthsci-ast-py/coverage.xml
          flags: python

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', 'beta', '1.89.0']  # 1.89.0 = MSRV
    defaults:
      run:
        working-directory: pkg/earthsci-ast-rs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # Registry + git checkouts ONLY -- deliberately NOT `target`.
      #
      # Caching `target` here cost far more than it bought. This job builds the
      # crate three ways (native, wasm32, `--all-features` tests) plus rustdoc,
      # so one cold run leaves a target tree tens of GB wide. Two consequences,
      # both observed:
      #   * The post-job `tar` writes cache.tzst onto the SAME runner volume it
      #     is compressing, and on the `stable` leg -- the only one that also
      #     builds wasm32 and rustdoc -- that ran the disk out ("No space left
      #     on device"), failing a job whose every real step had passed.
      #   * The saved entry was 7 GiB for the SMALLEST leg. A repository gets
      #     10 GiB of Actions cache total, so the three legs evicted each other
      #     and every other cache in the repo. Every rust-tests restore in
      #     recorded history reports "Cache not found" -- the target half of
      #     this cache has never once been reused.
      #
      # `~/.cargo/registry` + `~/.cargo/git` are a few hundred MB, do not
      # approach either limit, and save the crates.io downloads that are the
      # part actually worth keeping. Compile time is unchanged: these builds
      # were already cold on every run.
      #
      # (Note that `hashFiles` resolves to the empty string here -- Cargo.lock
      # is gitignored for this library crate -- so the key is effectively the
      # restore-key. Harmless for a download cache; it is why the entry is
      # rewritten on every run.)
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('pkg/earthsci-ast-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Build Rust library
        run: cargo build --verbose

      - name: Build CLI binary
        run: cargo build --bin esm --verbose

      - name: Install wasm32 target
        if: matrix.rust == 'stable'
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM
        if: matrix.rust == 'stable'
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo build --target wasm32-unknown-unknown --features wasm --verbose

      - name: Run WASM test suite
        if: matrix.rust == 'stable'
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: |
          # `wasm-bindgen-test-runner` must match the resolved `wasm-bindgen`
          # crate version exactly (it checks a schema version), so read the
          # version from Cargo.lock — written by the build steps above — and
          # install the matching runner. Node (preinstalled on the runner) drives
          # it via the `runner` set in .cargo/config.toml.
          wb=$(awk '/^name = "wasm-bindgen"$/{getline; print}' Cargo.lock | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Installing wasm-bindgen-cli $wb to match the crate"
          cargo install wasm-bindgen-cli --version "$wb"
          # Builds only the library + tests/wasm_suite.rs (a wasm32-gated target),
          # NOT the native-only unit/integration tests (filesystem / tempfiles /
          # native s2 C++ kernel), which cannot compile for wasm32.
          cargo test --target wasm32-unknown-unknown --features wasm --test wasm_suite

      - name: Run Rust tests
        # stable and beta test the whole surface. The MSRV leg names every
        # feature EXCEPT `esio`: that opt-in bridge pulls earthsciio -> zarrs,
        # whose own MSRV is 1.91, so `--all-features` cannot build the graph at
        # 1.89 at all. An opt-in integration raising the floor for the code that
        # opts in is normal, and testing it here would only assert that someone
        # else's crate supports our MSRV, which is not ours to claim.
        # `--all-features` has no "except" form, hence the list (`cli`/`solve`
        # arrive with the default feature set).
        run: |
          if [ "${{ matrix.rust }}" = "1.89.0" ]; then
            cargo test --verbose --features \
              conformance-adapters,wasm,parallel,simd,zero_copy,custom_alloc,benchmarks,performance
          else
            cargo test --verbose --all-features
          fi

      # `cargo test` does NOT build bench targets -- that needs `--benches` or
      # `--all-targets` -- so nothing above ever compiles benches/benchmarks.rs,
      # and it silently drifted out of compiling as five structs gained fields
      # (#218). Check-only: the point is that the benches still build against
      # current types, not to spend CI minutes measuring.
      #
      # Skipped on the MSRV leg for the same reason the test step drops `esio`
      # there: `--all-features` pulls earthsciio -> zarrs, whose own MSRV is
      # 1.91. Benches are dev tooling and make no MSRV claim, so checking them
      # on stable and beta is enough. `--all-features` (rather than just
      # `--features benchmarks`) matches the test step above, so this step
      # reuses that feature resolution instead of rebuilding the dependency
      # graph under a second one.
      #
      # `!cancelled()` for the reason spelled out on the lint job: a failing
      # test run must not silently skip this check, or a broken bench could
      # hide behind an unrelated red suite -- which is how the drift got here.
      - name: Build bench targets
        if: ${{ !cancelled() && matrix.rust != '1.89.0' }}
        run: cargo check --all-features --benches

      - name: Generate Rust documentation
        if: matrix.rust == 'stable'
        run: cargo doc --no-deps --all-features

  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    defaults:
      run:
        working-directory: pkg/earthsci-ast-go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('pkg/earthsci-ast-go/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download Go dependencies
        run: go mod download

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.go-version == '1.23'
        with:
          files: pkg/earthsci-ast-go/coverage.out
          flags: go

      - name: Build Go binary
        run: go build -v ./...

  # Cross-language conformance testing — only runs if all per-language suites pass.
  #
  # Deliberately NOT gated on `lint`. It needs each binding to BUILD and pass
  # its own suite, which is what the jobs below it establish; whether a file is
  # prettier-clean has no bearing on whether the five bindings agree on a
  # document. Gating it on style would put this suite back behind exactly the
  # kind of nit that kept the whole workflow red for 40 runs. `lint` still runs
  # and still fails the workflow on its own — it just does not withhold this
  # signal while it does.
  #
  # THE `needs:` LIST IS THE SUITE GATE, and is now the ONLY thing performing
  # that role (#224). The harness used to re-run all five suites itself before
  # generating any conformance output, which duplicated exactly the work these
  # five jobs had just finished — at ONE pinned version apiece, where the
  # matrix covers julia 1.10/1.12/1.13, node 20/22, python 3.9-3.12, rust
  # stable/beta/MSRV and go 1.21/1.22/1.23. Less coverage, for the whole cost.
  #
  # That duplication is why this job had NEVER completed: across the last 174
  # workflow runs it executed 28 times and all 28 died at the 45-minute wall,
  # the most recent still inside the first suite (`Pkg.test()`) 38.6 minutes
  # in, with no conformance output produced. `--skip-binding-suites` below
  # removes the duplicate, NOT the gate: keep this `needs:` list in step with
  # the per-language jobs, because dropping a language from it would let the
  # harness run against a binding whose suite nobody checked.
  standard-conformance-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [julia-tests, typescript-tests, python-tests, rust-tests, go-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pkg/earthsci-ast-ts/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            ~/.cache/pip
            ~/.cargo/registry
            ~/.cargo/git
            pkg/earthsci-ast-ts/node_modules
          key: ${{ runner.os }}-conformance-${{ hashFiles('pkg/*/Project.toml', 'pkg/*/package*.json', 'pkg/*/pyproject.toml', 'pkg/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      # Install dependencies for all languages
      - name: Install Julia dependencies
        working-directory: pkg/EarthSciAST.jl
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Install TypeScript dependencies and build
        working-directory: pkg/earthsci-ast-ts
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        working-directory: pkg/earthsci-ast-py
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      # Build exactly what the harness RUNS, which is not what this step used
      # to build. Every rust invocation in `test-conformance.sh` is a `cargo
      # run` on the DEV profile with `--features conformance-adapters`; the
      # release artifacts this step produced were used by nothing, at a
      # measured 4m21s per run (#224). Dev is not the slow profile here:
      # Cargo.toml pins `opt-level = 2` for this crate and its dependencies in
      # the dev profile precisely so the conformance producers run fast.
      #
      # This step is NOT cheaper than the one it replaces, and nothing here
      # claims it is: it builds three more bin targets at the same
      # optimisation level, so on its own it takes longer than the release
      # build did. What is saved is downstream — the crate is compiled ONCE,
      # here, instead of again inside the 45-minute harness step below, where
      # it was previously built twice over (once at default features for
      # `esm`, once with `conformance-adapters` for the first adapter).
      - name: Build Rust package
        working-directory: pkg/earthsci-ast-rs
        run: |
          cargo build --features conformance-adapters

      # Make scripts executable
      - name: Make conformance scripts executable
        run: |
          chmod +x scripts/test-conformance.sh
          chmod +x scripts/run-julia-conformance.jl
          chmod +x scripts/run-typescript-conformance.js
          chmod +x scripts/run-python-conformance.py

      # Run standard cross-language conformance testing.
      #
      # `--skip-binding-suites`: the five suites are the `needs:` gate above,
      # already run at more versions than this job could. What still runs here
      # is everything only this job can do — the per-binding conformance
      # PRODUCERS, the cross-language comparison, and the determinism /
      # geometry / cadence / PDE gates. A producer that fails still fails this
      # job. See the job comment and issue #224.
      - name: Run standard conformance tests
        run: |
          ./scripts/test-conformance.sh --skip-binding-suites

      # Upload conformance results (best-effort — partial output is useful for debugging)
      - name: Upload standard conformance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results-${{ github.run_number }}
          path: |
            conformance-results/
          retention-days: 30

  conformance-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [standard-conformance-testing]
    if: ${{ !cancelled() }}
    env:
      # 'success' | 'failure' | 'skipped' | 'cancelled'
      HARNESS_RESULT: ${{ needs.standard-conformance-testing.result }}
    # This is the only job that writes to the PR. The workflow-level default
    # is `contents: read`, under which the comment step below 403s on every
    # pull request ("Resource not accessible by integration"), failing the job
    # whatever the conformance outcome. Granted here rather than workflow-wide
    # so the ~20 test jobs keep the read-only token. A job-level block replaces
    # the workflow-level one outright, so `contents: read` is restated for
    # `actions/checkout`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      # Report NOT RUN and stop. No artifact exists to download, no verdict
      # exists to comment, and inventing either is the bug this guards against.
      - name: Report that conformance did not run
        if: ${{ needs.standard-conformance-testing.result == 'skipped' || needs.standard-conformance-testing.result == 'cancelled' }}
        run: |
          if [ "$HARNESS_RESULT" = "skipped" ]; then
            why="an upstream per-language job did not pass, so the harness never started"
          else
            why="the harness was cancelled (its own 45-minute timeout, most likely)"
          fi
          echo "::notice title=Conformance not run::$why — no conformance verdict was produced for this run."
          {
            echo "## ⏭️ Cross-language conformance: NOT RUN"
            echo
            echo "\`standard-conformance-testing\` reported \`$HARNESS_RESULT\`: $why."
            echo
            echo "**This is not a conformance result, in either direction.** Nothing was"
            echo "compared, so nothing passed and nothing failed. Whatever went wrong is"
            echo "red on its own job in this run."
          } >> "$GITHUB_STEP_SUMMARY"

      # Download all results
      - name: Download standard conformance results
        if: ${{ needs.standard-conformance-testing.result == 'success' || needs.standard-conformance-testing.result == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: conformance-results-${{ github.run_number }}
          path: standard-results/
        continue-on-error: true

      # Comment on PR with conformance results. Only when there IS a verdict:
      # a PR whose python job failed should not also collect a conformance
      # comment about results that were never computed.
      - name: Comment PR with enhanced conformance results
        if: ${{ github.event_name == 'pull_request' && (needs.standard-conformance-testing.result == 'success' || needs.standard-conformance-testing.result == 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              let analysisPath = 'standard-results/comparison/analysis.json';
              let analysisType = 'Standard';

              if (fs.existsSync(analysisPath)) {
                const analysis = JSON.parse(fs.readFileSync(analysisPath, 'utf8'));

                const overallStatus = analysis.overall_status || 'UNKNOWN';
                const languagesTested = analysis.languages_tested || [];
                const criticalDivergences = analysis.divergence_summary?.critical_divergences || [];

                let statusEmoji = '❓';
                if (overallStatus === 'PASS') statusEmoji = '✅';
                else if (overallStatus === 'WARN') statusEmoji = '⚠️';
                else if (overallStatus === 'FAIL') statusEmoji = '❌';

                let comment = `## ${statusEmoji} ${analysisType} Cross-Language Conformance Test Results\n\n`;
                comment += `**Overall Status:** ${overallStatus}\n`;
                comment += `**Languages Tested:** ${languagesTested.join(', ')}\n`;
                comment += `**Failing checks:** ${criticalDivergences.length}\n\n`;

                // Performance summary if available
                if (analysis.performance_analysis && analysis.performance_analysis.execution_time_stats) {
                  const perf = analysis.performance_analysis.execution_time_stats;
                  comment += `### Performance Summary:\n`;
                  comment += `- **Fastest:** ${perf.fastest_language}\n`;
                  comment += `- **Slowest:** ${perf.slowest_language}\n`;

                  if (analysis.performance_analysis.memory_usage_stats) {
                    const mem = analysis.performance_analysis.memory_usage_stats;
                    comment += `- **Lowest Memory:** ${mem.lowest_memory_language}\n`;
                    comment += `- **Highest Memory:** ${mem.highest_memory_language}\n`;
                  }
                  comment += '\n';
                }

                // Read ONLY keys that `build_analysis()` in
                // compare-conformance-outputs.py actually writes. This block used
                // to read `divergence.score`, `data.status`, `data.consistency_score`,
                // `data.divergent_tests` and `data.total_tests` — none of which
                // exist in that schema, which emits `divergent_count` per entry and
                // a plain integer per category. Every FAIL comment would have
                // rendered `NaN%` and `undefined/undefined`. Nobody had seen it,
                // because the harness had never once produced an analysis to
                // comment on (#224); the first real divergence this gate catches
                // must be readable.
                const sections = [
                  ['validation', analysis.validation_analysis],
                  ['display', analysis.display_analysis],
                  ['substitution', analysis.substitution_analysis],
                ];
                comment += `### Sections\n`;
                for (const [name, sec] of sections) {
                  const summary = (sec && sec.summary) || {};
                  const divergent = summary.divergent_tests ?? 0;
                  const total = summary.total_tests ?? 0;
                  comment += `- ${divergent === 0 ? '✅' : '❌'} **${name}**: ${divergent}/${total} divergent\n`;
                }
                comment += '\n';

                // `critical_divergences` and `divergence_summary.categories` carry
                // the same per-check counts; one rendering of them is enough.
                if (criticalDivergences.length > 0) {
                  comment += `### Failures by check\n`;
                  for (const divergence of criticalDivergences) {
                    comment += `- \`${divergence.category}\`: ${divergence.divergent_count} failure(s)\n`;
                  }
                  comment += '\n';
                }

                comment += `\n📊 [View detailed conformance report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              } else {
                // The harness RAN and still produced no analysis.json. That is
                // a broken harness, not a divergence between bindings — say
                // which, so nobody reads this as a conformance regression.
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: '⚠️ The conformance harness ran but produced no analysis file, so there is **no conformance verdict** for this run — this is not a report that the bindings diverged. See the `standard-conformance-testing` job logs.'
                });
              }
            } catch (error) {
              // Reporting the result must not decide the result. A fork PR
              // still carries a read-only token no `permissions:` block can
              // widen, so this path stays reachable by design.
              console.error('Error posting conformance results:', error);
              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `❌ Error processing conformance test results: ${error.message}`
                });
              } catch (postError) {
                console.error('Could not post the failure comment either:', postError);
              }
            }

      # Final status check. Only reachable when the harness actually ran — the
      # skipped/cancelled outcomes were reported as NOT RUN above and end this
      # job green, because there is no verdict to fail on and the real failure
      # is already red elsewhere in the run.
      - name: Check final conformance status
        if: ${{ needs.standard-conformance-testing.result == 'success' || needs.standard-conformance-testing.result == 'failure' }}
        run: |
          ANALYSIS_FILE=""
          if [ -f "standard-results/comparison/analysis.json" ]; then
            ANALYSIS_FILE="standard-results/comparison/analysis.json"
            echo "Using standard analysis results"
          fi

          if [ -n "$ANALYSIS_FILE" ]; then
            OVERALL_STATUS=$(python3 -c "import json; data=json.load(open('$ANALYSIS_FILE')); print(data.get('overall_status', 'UNKNOWN'))")
            CONSISTENCY_SCORE=$(python3 -c "import json; data=json.load(open('$ANALYSIS_FILE')); print(data.get('divergence_summary', {}).get('overall_score', 0))")

            echo "Overall conformance status: $OVERALL_STATUS"
            echo "Consistency score: $(python3 -c "print(f'{float('$CONSISTENCY_SCORE') * 100:.1f}%')")"

            case "$OVERALL_STATUS" in
              "PASS")
                echo "✅ Conformance tests passed - all implementations are consistent"
                exit 0
                ;;
              "WARN")
                echo "⚠️ Conformance tests passed with warnings - some minor divergences detected"
                exit 0
                ;;
              "FAIL")
                echo "❌ Conformance tests failed - implementations have significant divergences"
                exit 1
                ;;
              *)
                echo "❓ Conformance test status unknown"
                exit 1
                ;;
            esac
          else
            # The harness ran and produced nothing. Broken harness, not a
            # divergence — still red, but say which.
            echo "::error title=Conformance harness produced no analysis::The harness reported '$HARNESS_RESULT' but no comparison/analysis.json was uploaded. This is NOT a conformance verdict."
            echo "❌ The harness ran but produced no analysis file — see the standard-conformance-testing job"
            exit 1
          fi