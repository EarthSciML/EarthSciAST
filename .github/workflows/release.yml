name: Release 3 - Publish

# Step 3 of 3 (see release-register.yml). TagBot's push of `v<version>` starts
# this run, which publishes every non-Julia binding from that tag and attaches
# the `esm` and `esm-narrative` command-line tools to the GitHub release TagBot
# created. The jobs themselves live in EarthSciML/.github (RELEASING.md there).
#
# Every publish step treats "already published" as success, so a run that
# failed partway is finished by running this workflow by hand on the same tag.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)publish, e.g. v0.4.0. Steps already done are skipped.'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag must be the commit General accepted.
  resolve:
    uses: EarthSciML/.github/.github/workflows/release-resolve.yml@main
    with:
      julia-package: EarthSciAST
      julia-subdir: pkg/EarthSciAST.jl
      tag: ${{ inputs.tag || github.ref_name }}
      version-check: ./scripts/check-version-sync.sh

  # Python. Published from this workflow directly, never from a reusable one:
  # PyPI's trusted publishing cannot match a reusable workflow (RELEASING.md).
  publish-pypi:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/earthsci-ast
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and check distributions
        working-directory: pkg/earthsci-ast-py
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/earthsci-ast-py/dist
          # PyPI refuses a version that already exists; let a re-run be a no-op.
          skip-existing: true

  # crates.io, npm, the Go proxy, and the command-line tools.
  publish:
    needs: resolve
    permissions:
      contents: write
    uses: EarthSciML/.github/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      # Default features only: `esio` resolves earthsciio through a path into
      # the sibling EarthSciIO checkout, which does not exist on a CI runner.
      crates: pkg/earthsci-ast-rs
      npm-dir: pkg/earthsci-ast-ts
      # Ships as a library only (API_SPEC.md H-5): a module tag and a proxy fetch.
      go-module-dir: pkg/earthsci-ast-go
      cli-name: esm-cli
      cli-bins: pkg/earthsci-ast-rs:esm pkg/earthsci-narrative:esm-narrative
      install-notes: |
        ```
        using Pkg; Pkg.add("EarthSciAST")   # Julia
        npm install @earthsciml/ast          # TypeScript
        pip install earthsci-ast             # Python
        cargo add earthsci-ast               # Rust
        go get github.com/EarthSciML/EarthSciAST/pkg/earthsci-ast-go
        ```
    secrets: inherit

  report:
    needs: [ resolve, publish-pypi, publish ]
    if: always() && needs.resolve.result == 'success'
    permissions:
      issues: write
    uses: EarthSciML/.github/.github/workflows/release-report.yml@main
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      results: ${{ toJSON(needs) }}
