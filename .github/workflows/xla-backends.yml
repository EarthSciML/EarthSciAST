name: XLA Compiled Backends

# The XLA-only leg of the compiled backends, kept OUT of
# `conformance-testing.yml` on purpose.
#
# Two things in this repository emit an XLA program instead of walking a tree:
#
#   * Rust — `XlaBuilder` emission over the tape, behind the opt-in `xla` cargo
#     feature. That feature links a prebuilt 144 MB `xla_extension` release
#     that is fetched separately and never vendored, and its build script runs
#     bindgen, so it needs a libclang too.
#   * Julia — direct StableHLO emission in the Reactant extension
#     (`pkg/EarthSciAST.jl/ext/reactant_direct/`). Reactant bundles an XLA
#     runtime; precompiling it costs the better part of half an hour cold.
#
# Neither cost belongs in the main conformance workflow, which runs on every
# push to `pkg/**`. So `conformance-testing.yml` deliberately names its cargo
# features explicitly and never includes `xla`, never sets
# `XLA_EXTENSION_DIR`, and never sets `ESM_TEST_REACTANT`. There, the
# `compiled-RHS compiled producer` stages SKIP VISIBLY — legal because the tier
# manifest lists julia and rust as `bindings_optional` for the `compiled` engine
# (`tests/conformance/compiled_rhs/manifest.json`).
#
# The julia half of that skip had to be REPAIRED as part of this change. Rust's
# stage skips on its own (no `XLA_EXTENSION_DIR`, so the adapter is built
# without the feature and answers `unavailable`), but julia's adapter
# self-bootstraps an environment that LISTS Reactant, so `Pkg.instantiate()`
# installed it and the stage ran for real — in the main workflow, on every push.
# `scripts/test-conformance.sh` now gates that stage on `ESM_TEST_REACTANT`,
# which this job sets and the main workflow does not.
#
# HERE that same skip is a FAILURE. Both jobs run the tier and then assert on
# the report JSON that the binding's status is literally `ok`, because the
# runner's own exit code cannot do it: with an empty
# `engines.compiled.bindings_required` an `unavailable` binding exits 0. The
# runner has no `--require-available` flag and the manifest and runner are not
# this workflow's to change, so the assertion lives in a step of its own.
# If a `--require-available` option is ever added to
# `scripts/run-compiled-rhs-conformance.py`, replace the assert steps with it.
#
# THE SECOND TIER THIS WORKFLOW OWNS is `compiler_agreement` (CONFORMANCE_SPEC
# §5.44) under `--compiler xla`. Its ledger makes rust `bindings_required` for
# that compiler and julia `bindings_optional`, and for the same reasons as above
# `scripts/test-conformance.sh` registers no `xla` stage in its default run — so
# this is the only workflow where that requirement can be answered at all. The
# rust-xla job runs it through `./scripts/test-conformance.sh
# --compiler-agreement-only xla` once the extension is unpacked and
# XLA_EXTENSION_DIR exported. No assert step is needed there: `required` makes
# an `unavailable` non-zero on the runner's own exit code.

on:
  # The two path lists are spelled out twice, identically, on purpose:
  # GitHub Actions does not support YAML anchors/aliases, so `&`/`*` here
  # would not resolve. Keep them in sync by hand.
  push:
    branches: [ main ]
    paths:
      - 'pkg/earthsci-ast-rs/**'
      - 'pkg/EarthSciAST.jl/**'
      - 'tests/conformance/compiled_rhs/**'
      - 'tests/conformance/compiler_agreement/**'
      - 'scripts/run-compiled-rhs-conformance.py'
      - 'scripts/run-compiler-agreement-conformance.py'
      # The runner imports this; a change here can move the tier's verdict
      # without touching the runner itself.
      - 'scripts/conformance_lib.py'
      - 'scripts/assert-compiled-rhs-available.py'
      # The `xla` compiler-agreement stages are driven through this script's
      # `--compiler-agreement-only` gate, so a change to it moves this verdict.
      - 'scripts/test-conformance.sh'
      - 'scripts/fetch-xla-extension.sh'
      - '.github/workflows/xla-backends.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/earthsci-ast-rs/**'
      - 'pkg/EarthSciAST.jl/**'
      - 'tests/conformance/compiled_rhs/**'
      - 'tests/conformance/compiler_agreement/**'
      - 'scripts/run-compiled-rhs-conformance.py'
      - 'scripts/run-compiler-agreement-conformance.py'
      - 'scripts/conformance_lib.py'
      - 'scripts/assert-compiled-rhs-available.py'
      - 'scripts/test-conformance.sh'
      - 'scripts/fetch-xla-extension.sh'
      - '.github/workflows/xla-backends.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xla-backends-${{ github.ref }}
  # Same reasoning as the conformance workflow: these jobs are long (the julia
  # leg is the better part of an hour cold), so a superseded run must not keep
  # a runner busy while HEAD waits behind it.
  cancel-in-progress: true

env:
  # The pinned `xla_extension` release. Must match VERSION in
  # scripts/fetch-xla-extension.sh -- the cache key below is built from the
  # script's own bytes, so a bump there invalidates the cache automatically,
  # but this path has to be spelled out to export XLA_EXTENSION_DIR.
  XLA_EXTENSION_VERSION: '0.10.0'
  # Julia 1.12: the version the main workflow uses for its golden-regeneration
  # and coverage leg, and recent enough for Reactant (which is x86_64-linux
  # only for the prebuilt runtime this uses).
  JULIA_VERSION: '1.12'

jobs:
  # ---------------------------------------------------------------------------
  # Rust: the `xla` feature's own tests, then the compiled_rhs tier's Rust
  # compiled producer.
  #
  # Where the time goes: nearly all of it is compiling the crate graph with the
  # `xla` feature on and linking the test binaries. The tier step's `cargo run`
  # uses the SAME feature set as the build step, so it relinks rather than
  # rebuilds. The 144 MB extension download happens once per cache key. The
  # 90-minute budget is sized for a cold cache on a hosted runner, which is
  # slower than the development machine these steps were rehearsed on; it is a
  # ceiling, not a measurement.
  # ---------------------------------------------------------------------------
  rust-xla:
    name: Rust XlaBuilder backend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Disk, not speed, is the binding constraint. `cargo test --lib --tests`
    # links ~90 separate integration-test binaries against the whole crate
    # graph, and on a dev profile the great majority of what that writes is
    # debug info; a local cold run of exactly these steps left a target tree of
    # tens of GB, against a GitHub-hosted runner that has rather less free.
    # Full debug info buys nothing a CI log can use that `line-tables-only`
    # does not -- backtraces keep their file and line numbers -- and
    # incremental artifacts are pure waste in a job that never builds twice.
    # (The `rust-tests` job in conformance-testing.yml records the same tree
    # running a runner out of space when it tried to cache it.)
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Registry + git checkouts only, matching `rust-tests` in
      # conformance-testing.yml: that job's comment records that caching
      # `target` there blew past the 10 GiB per-repository Actions cache and
      # ran the runner disk out. The same applies here, more so -- the `xla`
      # feature's dependency graph is larger, not smaller.
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-xla-${{ hashFiles('pkg/earthsci-ast-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xla-

      # The `xla` crate's build script runs bindgen over the extension headers,
      # which needs libclang AND clang's own resource headers (stddef.h and
      # friends live under the clang install, not in libclang-dev). On the
      # cluster this repository is developed on these come from a module and
      # need LIBCLANG_PATH / BINDGEN_EXTRA_CLANG_ARGS; on ubuntu-latest the
      # distribution packages land where bindgen already looks, so neither
      # variable is set here. No `continue-on-error` anywhere in this workflow:
      # a missing tool must fail the job, never silently degrade it to a skip.
      - name: Install libclang and a C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang g++

      # Keyed on the fetch script itself: it pins both the release VERSION and
      # the SHA-256 of each archive, so any bump to either changes this key and
      # re-downloads. Nothing else can change what the script produces.
      - name: Cache the xla_extension release
        uses: actions/cache@v4
        with:
          path: ~/xla-ext
          key: xla-ext-cpu-${{ env.XLA_EXTENSION_VERSION }}-${{ hashFiles('scripts/fetch-xla-extension.sh') }}

      # Unconditional: the script is a no-op when the tree is already unpacked
      # ("already unpacked: ..."), so a cache hit still verifies the tree is
      # actually there rather than trusting the cache to have been complete.
      # `--dest` is OUTSIDE the checkout, which the script enforces.
      - name: Fetch the xla_extension release (cpu)
        run: scripts/fetch-xla-extension.sh --variant cpu --dest "$HOME/xla-ext"

      - name: Export XLA_EXTENSION_DIR
        run: |
          dir="$HOME/xla-ext/xla_extension-${XLA_EXTENSION_VERSION}-cpu/xla_extension"
          test -d "$dir/lib" || { echo "missing $dir/lib"; exit 1; }
          echo "XLA_EXTENSION_DIR=$dir" >> "$GITHUB_ENV"

      - name: Build with the xla feature
        working-directory: pkg/earthsci-ast-rs
        run: cargo build --features conformance-adapters,xla --verbose

      - name: Run Rust tests (lib + integration)
        working-directory: pkg/earthsci-ast-rs
        run: cargo test --features conformance-adapters,xla --lib --tests --verbose

      # Doctests link the extension at RUN time rather than going through the
      # crate's own build-script rpath, so they need the shared library on the
      # loader path. (The crate README says the same.)
      - name: Run Rust doctests
        working-directory: pkg/earthsci-ast-rs
        run: LD_LIBRARY_PATH="$XLA_EXTENSION_DIR/lib:${LD_LIBRARY_PATH:-}" cargo test --features conformance-adapters,xla --doc

      - name: compiled_rhs harness self-test
        run: python3 scripts/run-compiled-rhs-conformance.py --self-test

      - name: compiled_rhs tier — Rust compiled producer
        id: producer
        env:
          EARTHSCI_COMPILED_RHS_ADAPTER_RUST: cargo run --quiet --manifest-path pkg/earthsci-ast-rs/Cargo.toml --features conformance-adapters,xla --bin earthsci-compiled-rhs-adapter-rust --
        run: |
          mkdir -p conformance-results/compiled_rhs
          python3 scripts/run-compiled-rhs-conformance.py \
            --bindings rust --engine compiled \
            --output conformance-results/compiled_rhs/rust_compiled_report.json

      # The not-a-skip gate. See the header: the runner exits 0 on an
      # `unavailable` rust/compiled engine because the manifest lists rust as
      # optional there, which is exactly right for the main workflow and
      # exactly wrong here.
      #
      # The condition runs this whenever the producer step ITSELF ran, pass or
      # fail -- a producer that exited non-zero still wrote a report, and
      # reading it names the fixture and reason instead of leaving a bare red
      # step. It does NOT run when the producer was skipped because something
      # earlier failed (a build error, a missing extension): there is no report
      # to read then, and a second red step saying "cannot read report" would
      # only bury the real one.
      - name: Assert the Rust compiled engine actually ran
        if: ${{ !cancelled() && steps.producer.outcome != 'skipped' }}
        run: python3 scripts/assert-compiled-rhs-available.py conformance-results/compiled_rhs/rust_compiled_report.json rust

      - name: Upload the compiled_rhs report
        if: ${{ !cancelled() && steps.producer.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiled-rhs-rust-${{ github.run_number }}
          path: conformance-results/compiled_rhs/rust_compiled_report.json
          if-no-files-found: error

      # The compiler-agreement tier's `xla` producer (CONFORMANCE_SPEC §5.44).
      # THIS is the job that can run it. The tier ledger
      # (tests/conformance/compiler_agreement/manifest.json) makes rust
      # `bindings_required` for `xla`, but `scripts/test-conformance.sh`
      # registers no `xla` stage in its default run, because a plain checkout has
      # no `xla_extension` and an unconfigured build answers `unavailable` —
      # which for a required binding is RED. Until this step, that requirement
      # could therefore go neither red nor green anywhere.
      #
      # `--compiler-agreement-only xla` runs the harness self-test and the
      # producer stages the LEDGER names for `xla`, so it cannot drift from the
      # manifest. Today that is rust (required) plus julia (optional). Julia is
      # not installed in this job, and the gate SKIPS an optional binding whose
      # toolchain is absent, with a warning, rather than failing — which is
      # exactly what `bindings_optional` means. Julia's `xla` stays optional.
      #
      # XLA_EXTENSION_DIR has to be in this step's environment, not only the
      # build's: the runner adds the `xla` cargo feature to the adapter for
      # `--compiler xla` only when it is set, and builds WITHOUT the feature
      # otherwise, which would make this gate report `unavailable` (RED). The
      # export step above wrote it to $GITHUB_ENV, so every later step in this
      # job already has it; restating it here keeps that dependency visible on
      # the step that needs it.
      #
      # No extra assert step, unlike the compiled_rhs producer above: rust is
      # `bindings_required` for `xla`, so the runner's own exit code is already
      # non-zero on an `unavailable`.
      - name: compiler_agreement tier — xla
        env:
          XLA_EXTENSION_DIR: ${{ env.XLA_EXTENSION_DIR }}
        run: ./scripts/test-conformance.sh --compiler-agreement-only xla

      - name: Upload the compiler_agreement reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-agreement-xla-${{ github.run_number }}
          path: conformance-results/compiler_agreement/
          # `warn`, not `error`: the producer writes a report even when it fails,
          # so a missing one means something broke earlier, and a second red step
          # saying "no artifact" would only bury the real one.
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Julia: the direct StableHLO emitter's own test file, then the compiled_rhs
  # tier's Julia compiled producer.
  #
  # Where the time goes: on a COLD depot, overwhelmingly Reactant -- resolving
  # it, downloading its XLA runtime artifacts, and precompiling it -- and after
  # that, one XLA compile per fixture. A warm depot (julia-actions/cache) skips
  # the first of those entirely; only the compiles remain.
  #
  # timeout-minutes: 120 is deliberately generous rather than tuned. A cold run
  # killed mid-precompile leaves nothing in the cache, so the next run is cold
  # too and the job never converges. Better to let the first one finish long.
  # These steps were rehearsed against an already-warm depot, so the cold
  # figure here is a budget, not a measurement -- tighten it once real runs
  # have reported.
  # ---------------------------------------------------------------------------
  julia-xla:
    name: Julia direct StableHLO backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Job-wide: this is the repository's opt-in for anything Reactant. It gates
    # the `reactant_*_test.jl` files in the package's runtests.jl AND the julia
    # compiled stage of scripts/test-conformance.sh, so setting it here is what
    # makes this job the one place those run. (The tier steps below call the
    # runner directly and do not consult it; it is set at the job level so that
    # every Reactant-touching thing in this job agrees, and so the contrast with
    # conformance-testing.yml, which never sets it, is visible in one place.)
    env:
      ESM_TEST_REACTANT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
          arch: x64   # Reactant's prebuilt XLA runtime is x86_64-linux only

      - uses: julia-actions/cache@v2

      # The adapter self-bootstraps this env on first use
      # (compiled_rhs_adapter.jl: activate, `Pkg.develop` the package when
      # Manifest.toml is absent, instantiate). Doing it as its own step here
      # means Reactant precompiles ONCE, into the cache, and the test step and
      # the tier step both find it warm -- instead of the first of them paying
      # for it inside a step whose log is about something else.
      #
      # Manifest.toml is gitignored repo-wide, so `Pkg.develop` is what points
      # the env at THIS checkout rather than a registered EarthSciAST. It is
      # also why this step is not free on a warm run: the manifest is rebuilt
      # every time, since only the DEPOT (~/.julia) is what julia-actions/cache
      # carries across runs. What the cache saves is the download and the
      # precompile, which is the expensive part; the re-resolve is not.
      - name: Instantiate the Reactant adapter environment
        run: |
          julia --project=pkg/EarthSciAST.jl/scripts/compiled_rhs_reactant_env -e '
            using Pkg
            Pkg.develop(path="pkg/EarthSciAST.jl")
            Pkg.instantiate()
            Pkg.precompile()
          '

      # `Pkg.test()` on the package is not used on purpose: the full target is
      # heavy and runs the whole suite for the sake of one opt-in file. The
      # driver below is the standalone invocation the test file's own header
      # documents -- `cd` into test/ (the file includes testutils.jl and reads
      # fixtures relative to it) and include it, from the Reactant env.
      - name: Direct StableHLO emitter tests
        run: |
          julia --project=pkg/EarthSciAST.jl/scripts/compiled_rhs_reactant_env -e '
            cd("pkg/EarthSciAST.jl/test")
            include("reactant_direct_emit_test.jl")
          '

      # A SECOND Reactant environment, and the reason is the same one that gave
      # the compiled_rhs adapter its own: the file below drives the SOLVE path,
      # so it needs SciMLBase and an integrator, which
      # compiled_rhs_reactant_env deliberately does not carry (it exists for the
      # adapter and nothing else). compiler_agreement_reactant_env already
      # carries both, plus Reactant, so it is instantiated here rather than a
      # third env being invented. The depot is shared, so Reactant itself is
      # already precompiled by the step above and this resolve is cheap.
      - name: Instantiate the compiler-agreement Reactant environment
        run: |
          julia --project=pkg/EarthSciAST.jl/scripts/compiler_agreement_reactant_env -e '
            using Pkg
            Pkg.develop(path="pkg/EarthSciAST.jl")
            Pkg.instantiate()
            Pkg.precompile()
          '

      # `esm_problem(…; compiler = :xla)` — the emitter reached from the Problem
      # surface rather than from the emitter's own entry point. Run HERE and
      # nowhere else, for the same reason the step above is: it is the only job
      # that carries Reactant. Without this step the compiler keyword's whole
      # Julia lane would ship with no CI coverage, since conformance-testing.yml
      # never sets ESM_TEST_REACTANT and so takes runtests.jl's skip branch.
      - name: compiler = :xla on the solve path
        run: |
          julia --project=pkg/EarthSciAST.jl/scripts/compiler_agreement_reactant_env -e '
            cd("pkg/EarthSciAST.jl/test")
            include("compiler_xla_test.jl")
          '

      - name: compiled_rhs harness self-test
        run: python3 scripts/run-compiled-rhs-conformance.py --self-test

      - name: compiled_rhs tier — Julia compiled producer
        id: producer
        env:
          EARTHSCI_COMPILED_RHS_ADAPTER_JULIA: julia pkg/EarthSciAST.jl/scripts/compiled_rhs_adapter.jl --compiler native
        run: |
          mkdir -p conformance-results/compiled_rhs
          python3 scripts/run-compiled-rhs-conformance.py \
            --bindings julia --engine compiled \
            --output conformance-results/compiled_rhs/julia_compiled_report.json

      # Same condition, and the same reasoning, as the rust job's gate above.
      - name: Assert the Julia compiled engine actually ran
        if: ${{ !cancelled() && steps.producer.outcome != 'skipped' }}
        run: python3 scripts/assert-compiled-rhs-available.py conformance-results/compiled_rhs/julia_compiled_report.json julia

      - name: Upload the compiled_rhs report
        if: ${{ !cancelled() && steps.producer.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiled-rhs-julia-${{ github.run_number }}
          path: conformance-results/compiled_rhs/julia_compiled_report.json
          if-no-files-found: error
