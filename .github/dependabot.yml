# Dependabot version updates: one grouped pull request per ecosystem per week,
# so routine bumps arrive together instead of one PR per dependency. Security
# updates for a dependency with an advisory are separate and not grouped; they
# are switched on in the repository settings, not here.
version: 2
updates:
  - package-ecosystem: "julia"
    directory: "/pkg/EarthSciAST.jl"
    schedule:
      interval: "weekly"
    groups:
      julia:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/pkg/earthsci-ast-py"
    schedule:
      interval: "weekly"
    groups:
      uv:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/pkg/earthsci-ast-ts"
    schedule:
      interval: "weekly"
    ignore:
      # No typescript-eslint release accepts TypeScript 7 yet (its peer range
      # stops below 6.1), so the bump makes `npm ci` fail. Drop this once it does.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Each major from 14 on changes the shape of the generated src/generated.ts,
      # which is part of the published types. Adopt a new major as its own change.
      - dependency-name: "json-schema-to-typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directories:
      - "/pkg/earthsci-ast-rs"
      - "/pkg/earthsci-narrative"
      - "/pkg/earthsci-typst-plugin"
    schedule:
      interval: "weekly"
    ignore:
      # diffsol 0.18 changes the integrator's numbers (two data-source tests
      # move by ~1.5e-6 against a 1e-6 bar). Take it as its own numerics review.
      - dependency-name: "diffsol"
        versions: [">=0.12"]
      # Everything in the graph links getrandom 0.3, and 0.4's `wasm_js` does
      # not build under the Typst plugin's custom random source.
      - dependency-name: "getrandom"
        versions: [">=0.4"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/pkg/earthsci-ast-go"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
