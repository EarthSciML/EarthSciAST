# Topic grouping of the canonical STABLE operations, for the generated API
# reference (scripts/api_docs/render.py). Groups appear in this order.
#
# Each [[group]] has:
#   id          URL slug of the topic page
#   title       heading shown on the site
#   description one or two sentences for the topic page and the landing page
#   profile     optional capability profile from api-surface.json. When a
#               binding outside that profile does not export an operation of
#               this group, the reference gives the profile as the reason.
#   ops         canonical names from api-surface.json. A name covers every
#               stable kind it has (e.g. both the `esm_problem` function and
#               type); write "name:kind" to place one kind only.
#
# A stable symbol in no group is rendered under "Other", and render.py warns.
# A name here that is not a stable canonical name is an error.

[[group]]
id = "document-io"
title = "Document I/O"
description = "Reading a document from a path, a string or a parsed value, and serializing it back to JSON."
profile = "core"
ops = [
  "load_path", "load_string", "load_document", "load_options", "loader_field",
  "write_path", "to_json", "to_json_compact",
  "canonical_json", "canonicalize", "canonicalize_error", "format_canonical_float",
  "canonical_index_set_json", "emit_document", "emit_esm_string",
]

[[group]]
id = "versions"
title = "Versions and migration"
description = "The format and library version constants, and migrating a document written for an older version of the format."
profile = "core"
ops = [
  "schema_version", "library_version",
  "migrate", "can_migrate", "supported_migration_targets", "migration_error",
  "reject_expression_templates_pre_v04", "reject_solver_pre_v11",
  "reject_template_imports_pre_v08",
]

[[group]]
id = "validation"
title = "Validation"
description = "Checking a document against the schema and the structural rules of the specification, and reading the errors that result."
profile = "core"
ops = [
  "validate", "validate_schema", "validate_structural", "validate_text",
  "validate_path", "validation_result", "validation_error",
  "schema_error", "schema_validation_error", "structural_error",
]

[[group]]
id = "document-types"
title = "Document types"
description = "The in-memory types that mirror the sections of an .esm document: models, variables, equations, reaction systems, domains, events, data sources and more."
ops = [
  "esm_file", "metadata", "model", "model_variable", "parameter", "equation",
  "affect_equation", "species", "reaction", "reaction_system", "reference",
  "domain", "coordinate", "dimension", "temporal_domain", "time_span",
  "continuous_event", "discrete_event", "discrete_event_trigger",
  "functional_update", "parameter_update", "function_table",
  "function_table_axis", "operator", "solver", "tolerance", "distribution",
  "coupling_entry", "coupling_couple", "coupling_import",
  "coupling_import_options", "coupling_role",
  "data_source", "data_source_binding", "data_source_determinism",
  "data_source_kind", "data_source_location", "data_source_temporal",
  "parameter_sweep", "sweep_dimension", "sweep_range",
  "plot", "plot_axis", "plot_series", "plot_value",
]

[[group]]
id = "classification"
title = "Variable classification"
description = "Which variables of a model are integrated states, algebraic unknowns, observed quantities or parameters of each kind (esm-spec section 6.3.1)."
profile = "classification"
ops = [
  "ode_states", "algebraic_unknowns", "observed_unknowns", "is_ode_state",
  "unknowns", "parameters", "constant_parameters", "discrete_parameters",
  "sampled_parameters", "brownian_parameters", "free_parameters",
  "observed_definition", "observed_definitions",
  "system_kind", "declared_system_kind", "effective_system_kind",
  "variable_kind", "dae_info", "apply_dae_contract",
]

[[group]]
id = "expressions"
title = "Expressions"
description = "Parsing, inspecting, substituting into, simplifying and evaluating expressions and equations."
profile = "core"
ops = [
  "expr", "expr_node", "parse_expression", "parse_equation",
  "expression_parse_error", "free_variables", "contains",
  "substitute", "substitute_with_context", "substitute_in_equations",
  "substitute_in_model", "substitute_in_model_with_context",
  "substitute_in_reaction_system", "substitute_in_reaction_system_with_context",
  "simplify", "expand", "evaluate", "evaluate_closed_function",
  "closed_function_names", "closed_function_error",
]

[[group]]
id = "display"
title = "Display"
description = "Rendering expressions, equations, models and whole documents for people, as plain text, Unicode or LaTeX."
profile = "core"
ops = ["to_ascii", "to_unicode", "to_latex", "to_julia_code"]

[[group]]
id = "editing"
